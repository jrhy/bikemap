name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:run
      - run: pnpm lint
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_MAPBOX_TOKEN: ${{ vars.VITE_MAPBOX_TOKEN || secrets.VITE_MAPBOX_TOKEN }}
          VITE_CITY_ID: ${{ vars.VITE_CITY_ID || 'chattanooga' }}
        run: |
          if [ -z "$VITE_MAPBOX_TOKEN" ]; then
            echo 'Set the VITE_MAPBOX_TOKEN repository variable before publishing.' >&2
            exit 1
          fi
          pnpm build
          node scripts/verify-static.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
